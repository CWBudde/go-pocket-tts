name: Model Export (Ungated)

on:
  workflow_dispatch:
    inputs:
      go-version:
        description: Go version
        required: false
        type: string
        default: "1.25.x"
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.10"
      hf-repo:
        description: Hugging Face repo to download from
        required: false
        type: string
        default: "kyutai/pocket-tts-without-voice-cloning"
      model-variant:
        description: Legacy PocketTTS variant alias
        required: false
        type: string
        default: "b6369a24"
      model-language:
        description: Upstream PocketTTS language/config name
        required: false
        type: string
        default: "english_2026-01"
      max-seq:
        description: Maximum FlowLM latent steps for ONNX export
        required: false
        type: string
        default: "512"
      enable-int8:
        description: Enable ONNX INT8 quantization
        required: false
        type: boolean
        default: false
      release-tag:
        description: Optional GitHub Release tag to attach the packaged ONNX bundle to
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      go-version:
        description: Go version
        required: false
        type: string
        default: "1.25.x"
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.10"
      hf-repo:
        description: Hugging Face repo to download from
        required: false
        type: string
        default: "kyutai/pocket-tts-without-voice-cloning"
      model-variant:
        description: Legacy PocketTTS variant alias
        required: false
        type: string
        default: "b6369a24"
      model-language:
        description: Upstream PocketTTS language/config name
        required: false
        type: string
        default: "english_2026-01"
      max-seq:
        description: Maximum FlowLM latent steps for ONNX export
        required: false
        type: string
        default: "512"
      enable-int8:
        description: Enable ONNX INT8 quantization
        required: false
        type: boolean
        default: false
      release-tag:
        description: Optional GitHub Release tag to attach the packaged ONNX bundle to
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  export-onnx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs['go-version'] || '1.25.x' }}

      - name: Build PocketTTS CLIs
        run: |
          ls -la cmd
          go build -o pockettts-tools ./cmd/pockettts-tools

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs['python-version'] || '3.10' }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          uv pip install --system \
            pocket-tts \
            onnx \
            onnxruntime \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match

      - name: Download ungated PocketTTS model files
        run: |
          ./pockettts-tools model download \
            --hf-repo "${{ inputs['hf-repo'] || 'kyutai/pocket-tts-without-voice-cloning' }}" \
            --out-dir models

      - name: Export ONNX
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs['enable-int8'] }}" = "true" ]; then
            EXTRA_FLAGS="--int8"
          fi

          ./pockettts-tools model export \
            --models-dir models \
            --out-dir models/onnx \
            --variant "${{ inputs['model-variant'] || 'b6369a24' }}" \
            --language "${{ inputs['model-language'] || 'english_2026-01' }}" \
            --max-seq "${{ inputs['max-seq'] || '512' }}" \
            ${EXTRA_FLAGS}

      - name: List outputs
        run: |
          ls -lah models
          ls -lah models/onnx
          test -f models/onnx/manifest.json

      - name: Package ONNX bundle
        id: package
        run: |
          set -euo pipefail

          language="${{ inputs['model-language'] || 'english_2026-01' }}"
          variant="${{ inputs['model-variant'] || 'b6369a24' }}"
          archive="pockettts-onnx-${language}-stateful.tar.gz"
          sha_file="${archive}.sha256"

          tar -C models/onnx -czf "${archive}" .
          sha256sum "${archive}" > "${sha_file}"

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "sha_file=${sha_file}" >> "$GITHUB_OUTPUT"
          echo "variant=${variant}" >> "$GITHUB_OUTPUT"
          echo "language=${language}" >> "$GITHUB_OUTPUT"

      - name: Upload ONNX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pockettts-onnx-${{ github.run_id }}
          path: |
            models/download-manifest.lock.json
            models/onnx/manifest.json
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sha_file }}
          if-no-files-found: error

      - name: Attach ONNX bundle to release
        if: inputs['release-tag'] != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs['release-tag'] }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sha_file }}
